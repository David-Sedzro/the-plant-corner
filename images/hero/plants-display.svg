      <stop offset="0%" stop-color="#1E3F2F"/>
      <stop offset="100%" stop-color="#142C21"/>
    </linearGradient>
  </defs>
  
  <rect width="1600" height="900" fill="url(#bgGrad2)"/>
  
  <!-- Warm glow in center -->
  <circle cx="800" cy="450" r="500" fill="#F8F6EF" opacity="0.04"/>

