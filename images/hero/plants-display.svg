    <path d="M400 900 Q600 500 800 200" stroke="#3D6B53" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M450 900 Q700 550 950 300" stroke="#254B38" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M350 900 Q500 600 650 350" stroke="#467C5E" stroke-width="10" fill="none" stroke-linecap="round"/>

