    <path d="M1300 900 Q1150 560 1020 320" stroke="#254B38" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Terracotta Pots at the base -->
    <rect x="0" y="750" width="1600" height="150" fill="#20150E" opacity="0.5"/>
    <path d="M500 820 L520 720 L620 720 L640 820 Z" fill="#8FA68E" opacity="0.7"/>
    <path d="M700 840 L720 740 L800 740 L820 840 Z" fill="#2F5E47" opacity="0.7"/>
