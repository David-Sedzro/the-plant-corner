<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="terraceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EDEA"/>
      <stop offset="100%" stop-color="#C5DAD3"/>
    </linearGradient>
    <linearGradient id="stoneTable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C887E"/>
      <stop offset="100%" stop-color="#6E6A62"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#terraceSky)"/>

  <!-- Background garden pergola / trellis structure -->
  <g opacity="0.35">
    <line x1="0" y1="120" x2="800" y2="120" stroke="#254B38" stroke-width="8"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#254B38" stroke-width="8"/>
    <line x1="150" y1="0" x2="150" y2="500" stroke="#254B38" stroke-width="12"/>
    <line x1="650" y1="0" x2="650" y2="500" stroke="#254B38" stroke-width="12"/>
  </g>

  <!-- Outdoor Table & Linen -->
  <rect x="50" y="330" width="700" height="25" rx="3" fill="url(#stoneTable)"/>
  <rect x="70" y="355" width="20" height="145" fill="#4A4742"/>
  <rect x="710" y="355" width="20" height="145" fill="#4A4742"/>

  <!-- Linen runner on table -->
  <polygon points="260,330 540,330 520,380 280,380" fill="#EAE5D8"/>

  <!-- Center Group of Lush Garden Plants -->
  <!-- Center Potted Palm -->
  <g>
    <path d="M375 330 L385 240 L455 240 L465 330 Z" fill="#FFFFFF"/>
    <ellipse cx="420" cy="240" rx="36" ry="8" fill="#2E2015"/>
    <path d="M420 240 Q400 120 320 60" stroke="#254B38" stroke-width="5" fill="none"/>
    <path d="M420 240 Q450 110 520 50" stroke="#3D6B53" stroke-width="6" fill="none"/>
    <path d="M420 240 Q390 140 300 150" stroke="#2F5E47" stroke-width="5" fill="none"/>
    <path d="M420 240 Q470 130 550 140" stroke="#254B38" stroke-width="5" fill="none"/>
  </g>

  <!-- Left: Woven Basket with Tropical Philodendron -->
  <g>
    <path d="M180 330 L195 230 L295 230 L310 330 Z" fill="#997C5B"/>
    <circle cx="245" cy="160" r="75" fill="#1B382B"/>
    <circle cx="205" cy="130" r="60" fill="#254B38"/>
    <circle cx="280" cy="140" r="55" fill="#3D6B53"/>
  </g>

  <!-- Right: Terracotta Planter with Succulent/Cactus Cluster -->
  <g>
    <path d="M530 330 L545 250 L645 250 L660 330 Z" fill="#A87556"/>
    <ellipse cx="595" cy="250" rx="51" ry="10" fill="#2E2015"/>
    <path d="M595 250 Q595 160 590 110" stroke="#254B38" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M565 250 Q560 180 555 140" stroke="#3D6B53" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M625 250 Q630 190 635 150" stroke="#2F5E47" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
</svg>

