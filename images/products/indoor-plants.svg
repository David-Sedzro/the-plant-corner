<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="indoorWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE7DF"/>
      <stop offset="100%" stop-color="#D7D2C5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3025"/>
      <stop offset="100%" stop-color="#241B14"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C7B2"/>
      <stop offset="100%" stop-color="#A8947D"/>
    </linearGradient>
  </defs>

  <!-- Clean minimalist modern room backdrop -->
  <rect width="800" height="380" fill="url(#indoorWall)"/>
  <!-- Baseboard & hardwood floor -->
  <rect y="365" width="800" height="15" fill="#20150E"/>
  <rect y="380" width="800" height="120" fill="url(#floor)"/>

  <!-- Left: Black Metal Stand / Shelving -->
  <g opacity="0.85">
    <rect x="70" y="80" width="14" height="300" rx="3" fill="#1C1C1C"/>
    <rect x="230" y="80" width="14" height="300" rx="3" fill="#1C1C1C"/>
    <rect x="65" y="70" width="184" height="14" rx="4" fill="#1C1C1C"/>
    <rect x="65" y="220" width="184" height="10" fill="#1C1C1C"/>
    <rect x="65" y="340" width="184" height="10" fill="#1C1C1C"/>
  </g>

  <!-- Center-left: White Wooden Side Table -->
  <g>
    <rect x="330" y="270" width="220" height="25" rx="3" fill="#FFFFFF"/>
    <rect x="345" y="295" width="16" height="110" fill="#E8E8E8"/>
    <rect x="515" y="295" width="16" height="110" fill="#E8E8E8"/>
  </g>

  <!-- Majestic Potted Snake Plant on the White Table -->
  <g>
    <!-- Ceramic Terracotta Pot -->
    <path d="M380 270 L395 190 L485 190 L500 270 Z" fill="url(#potGrad)"/>
    <ellipse cx="440" cy="190" rx="46" ry="10" fill="#241B14"/>

    <!-- Snake Plant Upright Tall Leaves with Yellow/Green Variegation -->
    <path d="M440 190 Q435 60 440 20 Q445 60 440 190" fill="#254B38" stroke="#8FA68E" stroke-width="4"/>
    <path d="M420 190 Q405 90 415 45 Q425 90 420 190" fill="#1E3D2D" stroke="#8FA68E" stroke-width="3"/>
    <path d="M460 190 Q475 80 465 35 Q455 80 460 190" fill="#2F5E47" stroke="#8FA68E" stroke-width="3"/>
    <path d="M400 190 Q380 120 395 80 Q405 120 400 190" fill="#254B38" stroke="#8FA68E" stroke-width="3"/>
    <path d="M480 190 Q495 110 485 70 Q475 110 480 190" fill="#1E3D2D" stroke="#8FA68E" stroke-width="3"/>
  </g>

  <!-- Right: Elegant fiddle leaf plant in modern white pot -->
  <g opacity="0.9">
    <ellipse cx="680" cy="390" rx="55" ry="12" fill="#1A1A1A" opacity="0.3"/>
    <path d="M635 385 L645 280 L715 280 L725 385 Z" fill="#FFFFFF"/>
    <ellipse cx="680" cy="280" rx="36" ry="8" fill="#3D3025"/>
    <circle cx="680" cy="180" r="85" fill="#254B38"/>
    <circle cx="650" cy="140" r="70" fill="#2F5E47"/>
    <circle cx="710" cy="150" r="65" fill="#3D6B53"/>
  </g>
</svg>

