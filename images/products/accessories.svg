<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="livingWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E0DCD3"/>
    </linearGradient>
    <linearGradient id="sofaFab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5E0D8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#livingWall)"/>
  <rect y="380" width="800" height="120" fill="#2E231B"/>

  <!-- Cosy Living Room Sofa in Background -->
  <g opacity="0.85">
    <rect x="30" y="150" width="450" height="230" rx="16" fill="url(#sofaFab)"/>
    <!-- Cushions -->
    <rect x="60" y="170" width="100" height="100" rx="12" fill="#D0C9BD"/>
    <rect x="180" y="170" width="100" height="100" rx="12" fill="#8FA68E" opacity="0.7"/>
    <rect x="300" y="170" width="100" height="100" rx="12" fill="#D0C9BD"/>
  </g>

  <!-- Modern White Coffee Table in Foreground -->
  <polygon points="120,380 420,380 390,320 90,320" fill="#FFFFFF"/>
  <line x1="100" y1="380" x2="140" y2="440" stroke="#1A1A1A" stroke-width="8"/>
  <line x1="400" y1="380" x2="360" y2="440" stroke="#1A1A1A" stroke-width="8"/>

  <!-- Wool Textured Rug on Floor -->
  <polygon points="80,420 450,420 400,480 30,480" fill="#EAE5DC" opacity="0.9"/>

  <!-- Potted Plant on Table & Floor -->
  <g>
    <!-- Ceramic Planter with Plant on coffee table -->
    <path d="M220 320 L230 250 L290 250 L300 320 Z" fill="#FFFFFF"/>
    <circle cx="260" cy="200" r="45" fill="#254B38"/>
    <circle cx="280" cy="180" r="35" fill="#3D6B53"/>

    <!-- Large Floor Standing Ceramic Pot with Lush Greenery on Right -->
    <path d="M600 380 L620 230 L740 230 L760 380 Z" fill="#FFFFFF"/>
    <ellipse cx="680" cy="230" rx="60" ry="12" fill="#3D2B1F"/>
    <!-- Large architectural leaves cascading -->
    <circle cx="680" cy="120" r="110" fill="#1B382B"/>
    <circle cx="620" cy="90" r="95" fill="#254B38"/>
    <circle cx="740" cy="100" r="85" fill="#3D6B53"/>
  </g>
</svg>

